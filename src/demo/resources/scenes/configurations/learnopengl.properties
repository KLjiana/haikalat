# Stable asset manifest: shaders, textures, materials, and external models.
# shader.<name>.vertex / shader.<name>.fragment
shader.color.vertex=/shaders/scene/color-scene.vert
shader.color.fragment=/shaders/scene/lit-scene.frag
shader.textured.vertex=/shaders/scene/textured-scene.vert
shader.textured.fragment=/shaders/scene/lit-scene.frag
shader.instanced.vertex=/shaders/instancing/instanced-scene.vert
shader.instanced.fragment=/shaders/basic/vertex-color-unlit.frag
shader.model.vertex=/shaders/scene/model-scene.vert
shader.model.fragment=/shaders/scene/lit-scene.frag
shader.pbrForward.vertex=/shaders/render3d/pbr/pbr-forward.vert
shader.pbrForward.fragment=/shaders/render3d/pbr/pbr-forward.frag

# The packaged baseline officially exercises the classpath OBJ loader path.
model.pyramid.path=/models/obj/baseline-pyramid.obj

# texture.<name>.path / texture.<name>.flipVertically / texture.<name>.colorSpace
texture.wall.path=/textures/learnopengl/wall.png
texture.wall.flipVertically=false
texture.wall.colorSpace=srgb
texture.face.path=/textures/learnopengl/awesomeface.png
texture.face.flipVertically=true
texture.face.colorSpace=srgb
texture.pbrBase.path=/textures/learnopengl/wall.png
texture.pbrBase.flipVertically=true
texture.pbrBase.colorSpace=srgb
texture.pbrNormal.path=/textures/learnopengl/wall.png
texture.pbrNormal.flipVertically=true
texture.pbrNormal.colorSpace=linear
texture.pbrMetalRough.path=/textures/learnopengl/awesomeface.png
texture.pbrMetalRough.flipVertically=true
texture.pbrMetalRough.colorSpace=linear
texture.pbrAo.path=/textures/learnopengl/wall.png
texture.pbrAo.flipVertically=true
texture.pbrAo.colorSpace=linear
texture.pbrEmissive.path=/textures/learnopengl/awesomeface.png
texture.pbrEmissive.flipVertically=true
texture.pbrEmissive.colorSpace=srgb

# material.<name>.shader / blend / depthTest / texture.<sampler uniform>
material.color.shader=color
material.color.blend=opaque
material.color.depthTest=true

material.wall.shader=textured
material.wall.blend=opaque
material.wall.depthTest=true
material.wall.texture.uTexture=wall
material.wall.texture.uTexture.unit=0

material.face.shader=textured
material.face.blend=alpha
material.face.depthTest=true
material.face.texture.uTexture=face
material.face.texture.uTexture.unit=0

material.model.shader=model
material.model.blend=opaque
material.model.depthTest=true

material.pbrProof.model=metallicRoughness
material.pbrProof.shader=pbrForward
material.pbrProof.blend=opaque
material.pbrProof.depthTest=true
material.pbrProof.pbr.baseColorFactor=1,1,1,1
material.pbrProof.pbr.metallicFactor=0.7
material.pbrProof.pbr.roughnessFactor=0.35
material.pbrProof.pbr.normalScale=0.45
material.pbrProof.pbr.occlusionStrength=1
material.pbrProof.pbr.emissiveFactor=0.02,0.02,0.02
material.pbrProof.pbr.baseColorTexture=pbrBase
material.pbrProof.pbr.normalTexture=pbrNormal
material.pbrProof.pbr.metallicRoughnessTexture=pbrMetalRough
material.pbrProof.pbr.occlusionTexture=pbrAo
material.pbrProof.pbr.emissiveTexture=pbrEmissive

# Simple demo scene binding. Animation remains in Java ModelUpdater code.
# Builtin model names are limited to builtin:triangle, builtin:quad, builtin:texturedQuad.
# object.<name>.model / material / position / rotation / scale / castShadows
object.triangle.model=builtin:triangle
object.triangle.material=color
object.triangle.position=-1.5,0.5,-2.5
object.triangle.rotation=0,0,0
object.triangle.scale=1
object.triangle.castShadows=true

object.wall.model=builtin:texturedQuad
object.wall.material=wall
object.wall.position=1.0,0.5,-2.5
object.wall.rotation=0,0,0
object.wall.scale=1
object.wall.castShadows=true

object.coloredQuad.model=builtin:quad
object.coloredQuad.material=color
object.coloredQuad.position=-1.5,-1.0,-3.0
object.coloredQuad.rotation=0,0,0
object.coloredQuad.scale=0.6
object.coloredQuad.castShadows=true

object.face.model=builtin:texturedQuad
object.face.material=face
object.face.position=1.5,-1.0,-3.0
object.face.rotation=0,0,0
object.face.scale=0.5
object.face.castShadows=false

object.ground.model=builtin:quad
object.ground.material=color
object.ground.position=0.0,-1.4,-3.0
# Rotation values are radians. -PI/2 lays the quad flat on the XZ plane.
object.ground.rotation=-1.5707963,0,0
object.ground.scale=6.0
object.ground.castShadows=false

object.pyramid.model=pyramid
object.pyramid.material=model
object.pyramid.position=0.0,-0.35,-2.0
object.pyramid.rotation=0,0,0
object.pyramid.scale=0.65
#TODO fix shadow
object.pyramid.castShadows=false

object.pbrProof.model=pyramid
object.pbrProof.material=pbrProof
object.pbrProof.position=2.8,-0.55,-3.0
object.pbrProof.rotation=0,0,0
object.pbrProof.scale=0.38
object.pbrProof.castShadows=true

# light.<name>.type / vector / color / intensity / range / castShadows
light.sun.type=directional
light.sun.vector=-0.3,-1.0,-0.4
light.sun.color=1.0,0.96,0.86
light.sun.intensity=1.0
light.sun.range=0
light.sun.castShadows=true

light.fill.type=point
light.fill.vector=1.5,1.0,1.0
light.fill.color=0.35,0.5,1.0
light.fill.intensity=1.5
light.fill.range=10.0
light.fill.castShadows=false

# glTF 内部 mesh/material 由静态资产管线装配；两个 node 共享同一 GPU mesh。
gltf.showcase.path=/scenes/gltf/showcase.gltf
gltf.showcase.scene=showcase
gltf.showcase.position=-0.5,0.5,-3.2
gltf.showcase.rotation=0,0,0
gltf.showcase.scale=0.55
gltf.showcase.castShadows=true
