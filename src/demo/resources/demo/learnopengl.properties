# shader.<name>.vertex / shader.<name>.fragment
shader.color.vertex=/demo/color_scene.vert
shader.color.fragment=/demo/color_mvp.frag
shader.textured.vertex=/demo/textured_scene.vert
shader.textured.fragment=/demo/textured_mvp.frag
shader.instanced.vertex=/demo/instanced_scene.vert
shader.instanced.fragment=/demo/instanced_projview.frag

# texture.<name>.path / texture.<name>.flipVertically
texture.wall.path=/wall.png
texture.wall.flipVertically=false
texture.face.path=/awesomeface.png
texture.face.flipVertically=true

# object.<name>.model / material / position / rotation / scale / castShadows
object.triangle.model=builtin:triangle
object.triangle.material=color
object.triangle.position=-1.5,0.5,-2.5
object.triangle.rotation=0,0,0
object.triangle.scale=1
object.triangle.castShadows=true

object.wall.model=builtin:texturedQuad
object.wall.material=wall
object.wall.position=1.0,0.5,-2.5
object.wall.rotation=0,0,0
object.wall.scale=1
object.wall.castShadows=true

object.coloredQuad.model=builtin:coloredQuad
object.coloredQuad.material=color
object.coloredQuad.position=-1.5,-1.0,-3.0
object.coloredQuad.rotation=0,0,0
object.coloredQuad.scale=0.6
object.coloredQuad.castShadows=true

object.face.model=builtin:texturedQuad
object.face.material=face
object.face.position=1.5,-1.0,-3.0
object.face.rotation=0,0,0
object.face.scale=0.5
object.face.castShadows=false

# light.<name>.type / vector / color / intensity / range / castShadows
light.sun.type=directional
light.sun.vector=-0.3,-1.0,-0.4
light.sun.color=1.0,0.96,0.86
light.sun.intensity=1.0
light.sun.range=0
light.sun.castShadows=true
