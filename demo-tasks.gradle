                'Injects an environment load failure and verifies deterministic cleanup.']
        ,runPostProcessEffectsIntegration  : [pbrMain,
                ['--hidden', '--frames=8', '--environment-quality=test', '--aa=none',
                 '--auto-exposure=off', '--bloom=off', '--color-grading=on', '--fog=on',
                 '--resize-frame=4'],
                'Runs color grading and depth-based distance/height fog through resize.']
        ,runLocalShadowsIntegration        : [pbrMain,
                ['--hidden', '--frames=4', '--environment-quality=test', '--aa=none',
                 '--auto-exposure=off', '--bloom=off', '--local-shadows=on'],
                'Runs directional, six-face point and spot shadow passes in one PBR scene.']
        ,runGltfIntegration                : [gltfMain,
                ['--deterministic', '--frames=8', '--aa=FXAA', '--bloom', '--auto-exposure'],
