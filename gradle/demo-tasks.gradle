def registerAnimationVerificationTest = { taskName, descriptionText, patterns, gl ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = descriptionText
        dependsOn testClasses
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform()
        systemProperty 'haikalat.glSmoke', gl ? 'true' : 'false'
        filter {
            patterns.each { includeTestsMatching it }
        }
    }
}

registerAnimationVerificationTest('runAnimationGraphIntegration',
        'Runs deterministic graph, transition, Blend Tree and marker-sync tests.',
        ['*.AnimationGraphTest'], false)
registerAnimationVerificationTest('runAnimationAdditiveIntegration',
        'Runs additive pose and fixed-capacity layer-stack tests.',
        ['*.AnimationGraphTest', '*.AnimationClipTest', '*.AnimationPlayerTest'], false)
registerAnimationVerificationTest('runAnimationConstraintIntegration',
        'Runs Look-at, joint-limit, FABRIK, two-hand and pure-input Foot IK tests.',
        ['*.AnimationConstraintTest'], false)
registerAnimationVerificationTest('runAnimationVfxBridgeIntegration',
        'Runs deterministic one-way animation-signal to VFX orchestration.',
        ['*.CharacterEffectBridgeTest'], false)
registerAnimationVerificationTest('runGltfMorphIntegration',
        'Runs glTF morph decode, weights animation and pure-JVM sampling.',
        ['*.MorphWeightTrackTest', '*.GltfAnimationRigTest',
         '*.GltfAssetLoaderTest'], false)
registerAnimationVerificationTest('runGltfSharedAnimationIntegration',
        'Runs shared GLB animation-set binding and library clip-selection tests.',
        ['*.GltfAnimationSetTest', '*.GltfAnimationLibraryTest'], false)
registerAnimationVerificationTest('runGltfMorphSkinningIntegration',
        'Runs real-GL per-instance morph, PBR and directional-shadow verification.',
        ['*.GltfRuntimeGlTest.morphWeightsArePerInstanceAndDeformForwardAndShadowPasses',
         '*.GltfRuntimeGlTest.injectedMorphUploadFailureRollsBackBuffersAndLibraryLease'],
        true)

