[
        [name: 'ForestMorning', main: render3dForestCaptureMain,
         options: ['--route', '--load-config=config/visual-profiles/forest_morning.properties'],
         id: 'forest_morning'],
        [name: 'ForestDusk', main: render3dForestCaptureMain,
         options: ['--route', '--load-config=config/visual-profiles/forest_dusk.properties'],
         id: 'forest_dusk'],
        [name: 'TownNight', main: clusteredMain,
         options: ['--scene=town', '--camera-path=street',
                   '--profile=config/visual-profiles/town_night.properties'],
         id: 'town_night']
].each { spec ->
    [FogOff: spec.main == render3dForestCaptureMain ? '--fog=off' : '--fog=false',
     BloomOff: spec.main == render3dForestCaptureMain ? '--bloom=off' : '--bloom=false',
     GrayModel: '--gray-model'
    ].each { variant, flag ->
        tasks.register("runRender3d${spec.name}${variant}Baseline", JavaExec) {
            group = 'verification'
            description = "Captures ${spec.id} with ${variant} at the frozen frame 420."
            dependsOn demoClasses
            classpath = sourceSets.demo.runtimeClasspath
            mainClass = spec.main
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
            workingDir = projectDir
            args '--hidden', '--frames=421', '--size=1280x720'
            if (spec.main == render3dForestCaptureMain) args '--no-vsync'
            args(*spec.options)
            args flag,
                    "--capture-at=420:build/reports/render3d-v0243/visual/variants/${spec.id}-${variant == 'FogOff' ? 'fog-off' : variant == 'BloomOff' ? 'bloom-off' : 'gray-model'}-0420.png"
            inputs.file "config/visual-profiles/${spec.id}.properties"
            outputs.file "build/reports/render3d-v0243/visual/variants/${spec.id}-${variant == 'FogOff' ? 'fog-off' : variant == 'BloomOff' ? 'bloom-off' : 'gray-model'}-0420.png"
        }
    }
}

