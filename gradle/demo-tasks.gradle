tasks.named('runRender3dVolumetricFogBenchmarks') {
    mustRunAfter 'check', 'publicApiGuard', 'assetManifestGuard', 'runRender3dVolumetricFogIntegration', 'runRender3dVolumetricFogQuality', 'runRender3dVolumetricFogQualityTemporal'
}
registerDemoJavaExec('runRender3dVolumetricFogCpuAttribution', 'verification',
        'Runs explicitly nonformal CPU attribution with per-frame GPU isolation; it cannot satisfy the formal performance gate.',
        'com.kaleblangley.haikalat.demo.pbr.Render3dVolumetricFogBenchmarks', ['--cpu-isolation'])
