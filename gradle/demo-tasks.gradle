    mustRunAfter 'runRender3dVolumetricFogBenchmarks'
}

tasks.register('runRender3dVolumetricFogIntegration', Test) {
    group = 'verification'
    description = 'Runs the current v0.25 real-GL matrix: storage, transport, lights, shadows, composition and independent volumetric history/reactive.'
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'haikalat.glSmoke', 'true'
    systemProperty 'haikalat.glReadback', 'true'
    systemProperty 'haikalat.internal.volume.diagnostics', 'true'
    filter {
        includeTestsMatching '*.VolumetricTextureGlTest'
        includeTestsMatching '*.VolumetricResourcesGlTest'
        includeTestsMatching '*.VolumetricMediumGlTest'
        includeTestsMatching '*.VolumetricGenerationGlTest'
        includeTestsMatching '*.VolumetricLightingGlTest'
        includeTestsMatching '*.VolumetricShadowGlTest'
        includeTestsMatching '*.VolumetricCompositeGlTest'
        includeTestsMatching '*.VolumetricTemporalGlTest'
    }
}

