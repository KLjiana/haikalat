tasks.register('runRender3dGtaoBenchmarks', JavaExec) {
    group = 'verification'
    description = 'Runs enabled/disabled GTAO A/B timing, percentile and allocation gates at configurable 1080p/4K sizes.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.demo.pbr.Render3dGtaoBenchmarkSuite'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    workingDir = projectDir
    def benchmarkMode = providers.gradleProperty('gtaoBenchmarkMode').getOrElse('comparison')
    if (!(benchmarkMode in ['enabled', 'disabled', 'comparison'])) {
        throw new GradleException('gtaoBenchmarkMode must be enabled, disabled or comparison')
    }
    args "--rounds=${providers.gradleProperty('gtaoBenchmarkRounds').getOrElse('3')}",
            "--frames=${providers.gradleProperty('gtaoBenchmarkFrames').getOrElse('60')}",
            "--warmup=${providers.gradleProperty('gtaoBenchmarkWarmup').getOrElse('30')}",
            "--sizes=${providers.gradleProperty('gtaoBenchmarkSizes').getOrElse('1920x1080,3840x2160')}",
            "--mode=${benchmarkMode}",
            "--max-cpu-delta-ms=${providers.gradleProperty('gtaoBenchmarkMaxCpuDeltaMs').getOrElse('0.35')}",
            "--max-cpu-p95-delta-ms=${providers.gradleProperty('gtaoBenchmarkMaxCpuP95DeltaMs').getOrElse('0.75')}",
            "--max-disabled-regression=${providers.gradleProperty('gtaoBenchmarkMaxDisabledRegression').getOrElse('0.02')}",
            "--max-allocation-trend-kib=${providers.gradleProperty('gtaoBenchmarkMaxAllocationTrendKiB').getOrElse('0.5')}",
            "--max-gtao-gpu-1080p-ms=${providers.gradleProperty('gtaoBenchmarkMaxGtaoGpu1080pMs').getOrElse('2.0')}",
            "--max-gtao-gpu-4k-ms=${providers.gradleProperty('gtaoBenchmarkMaxGtaoGpu4kMs').getOrElse('4.0')}"
}

