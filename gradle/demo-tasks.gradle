def registerDemoJavaExec = { taskName, taskGroup, descriptionText, mainClassName, launchArgs ->
    tasks.register(taskName, JavaExec) {
        group = taskGroup
        description = descriptionText
        dependsOn demoClasses
        classpath = sourceSets.demo.runtimeClasspath
        mainClass = mainClassName
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
        workingDir = projectDir
        args launchArgs
    }
}

registerDemoJavaExec('runRender3dVolumetricFogBaseline', 'verification',
        'Captures the v0.25 M0 source identity, real GL binding limits and resource budgets.',
        'com.kaleblangley.haikalat.demo.pbr.Render3dVolumetricBaseline', [])

registerDemoJavaExec('runRender3dVolumetricFogDemo', 'demo',
        'Runs the shared four-scene volumetric fog demo with strict schema 2 profiles and explicit HDR/slice captures.',
        'com.kaleblangley.haikalat.demo.pbr.Render3dVolumetricFogDemo', [])

registerDemoJavaExec('runRender3dVolumetricFogQuality', 'verification',
        'Compares native-pixel linear HDR with independent full-light 256/512+ ray references and runs the analytic/history GL contracts.',
        'com.kaleblangley.haikalat.demo.pbr.Render3dVolumetricFogQuality', [])
tasks.named('runRender3dVolumetricFogQuality') {
    dependsOn 'runRender3dVolumetricFogIntegration'
    mustRunAfter 'check', 'publicApiGuard', 'assetManifestGuard'
}

registerDemoJavaExec('runRender3dVolumetricFogQualityTemporal', 'verification',
        'Measures final linear HDR stability and light-off recovery in all four scenes and three independent history combinations.',
        'com.kaleblangley.haikalat.demo.pbr.Render3dVolumetricFogTemporalQuality', [])
tasks.named('runRender3dVolumetricFogQualityTemporal') {
    dependsOn 'runRender3dVolumetricFogIntegration'
    mustRunAfter 'check', 'publicApiGuard', 'assetManifestGuard', 'runRender3dVolumetricFogQuality'
    // Diagnostic snapshots are streamed to disk; bound GC-managed command staging during long matrices.
    maxHeapSize = '1g'
    jvmArgs '-XX:MaxDirectMemorySize=256m'
}

registerDemoJavaExec('runRender3dVolumetricFogBenchmarks', 'verification',
        'Measures native 1080p/4K fog on/off with round-major A/B, same-frame GPU sums and every drain wait recorded.',
