def sceneScalabilityMainClass = 'com.kaleblangley.haikalat.demo.SceneScalabilityDemo'

tasks.register('runSceneScalabilityDemo', JavaExec) {
    group = 'application'
    description = 'Runs the deterministic ordinary-renderer visibility and queue showcase.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = sceneScalabilityMainClass
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    workingDir = projectDir
    args "--objects=${providers.gradleProperty('sceneObjects').getOrElse('10000')}",
            "--layout=${providers.gradleProperty('sceneLayout').getOrElse('large')}",
            "--visibility=${providers.gradleProperty('sceneVisibility').getOrElse('enabled')}",
            "--model-source=${providers.gradleProperty('sceneModelSource').getOrElse('dynamic')}",
            "--static-cache=${providers.gradleProperty('sceneStaticCache').getOrElse('enabled')}",
            "--queue-cache=${providers.gradleProperty('sceneQueueCache').getOrElse('enabled')}",
            "--command-matrix-arena=${providers.gradleProperty('sceneMatrixArena').getOrElse('enabled')}",
            "--frames=${providers.gradleProperty('sceneFrames').getOrElse('1000')}",
            "--warmup=${providers.gradleProperty('sceneWarmup').getOrElse('100')}",
            "--rounds=${providers.gradleProperty('sceneRounds').getOrElse('1')}",
            "--size=${providers.gradleProperty('sceneSize').getOrElse('1280x720')}"
    if (providers.gradleProperty('sceneDeterministic').getOrElse('false').toBoolean()) {
        args '--deterministic'
    }
    if (providers.gradleProperty('sceneVerify').getOrElse('false').toBoolean()) {
        args '--verify'
    }
}

tasks.register('sceneVisibilityJvmVerification', Test) {
    group = 'verification'
    description = 'Validates bounds, world transforms, frusta and primitive render-queue sorting.'
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.kaleblangley.haikalat.core.mesh.Bounds3fTest'
        includeTestsMatching 'com.kaleblangley.haikalat.core.mesh.MeshDataBoundsTest'
        includeTestsMatching 'com.kaleblangley.haikalat.subsystems.render3d.BoundsTransformsTest'
        includeTestsMatching 'com.kaleblangley.haikalat.subsystems.render3d.FrustumTest'
        includeTestsMatching 'com.kaleblangley.haikalat.subsystems.render3d.RenderQueueSorterTest'
    }
    outputs.upToDateWhen { false }
}

