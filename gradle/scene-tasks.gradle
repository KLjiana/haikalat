tasks.register('runSceneSubmissionJfr', JavaExec) {
    group = 'application'
    description = 'Records a 10k real glTF submission JFR allocation profile.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = gltfSceneScalabilityMainClass
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    workingDir = projectDir
    def recording = layout.buildDirectory.file('reports/jfr/v0.17-scene-submission.jfr')
    def jfrTemporary = layout.buildDirectory.dir('tmp/jfr')
    doFirst {
        recording.get().asFile.parentFile.mkdirs()
        jfrTemporary.get().asFile.mkdirs()
    }
    environment 'TEMP', jfrTemporary.get().asFile.absolutePath
    environment 'TMP', jfrTemporary.get().asFile.absolutePath
    jvmArgs "-XX:StartFlightRecording=filename=${recording.get().asFile.absolutePath},settings=profile,delay=3s,duration=5s,dumponexit=true"
    args '--renderers=10000', '--layout=mostly-hidden', '--visibility=enabled',
            '--static-cache=enabled', '--queue-cache=enabled',
            '--command-matrix-arena=enabled', '--frames=10000', '--warmup=1000',
            '--rounds=1', '--size=1280x720', '--deterministic'
    outputs.file recording
    outputs.upToDateWhen { false }
}

