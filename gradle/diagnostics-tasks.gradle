tasks.register('runDiagnosticsResizeIntegration', JavaExec) {
    group = 'verification'
    description = 'Captures a deterministic resize and validates managed/fixed graph target metadata.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.demo.LearnOpenGlDemo'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    workingDir = projectDir
    args '--deterministic', '--quiet', '--frames=12', '--resize=4:960x540',
            '--diagnostics=detailed', '--diagnostics-export=build/diagnostics/resize.json',
            '--diagnostics-verify-cleanup'
    outputs.file layout.buildDirectory.file('diagnostics/resize.json')
    outputs.upToDateWhen { false }
    mustRunAfter 'runDiagnosticsIntegration'
    doLast {
        def capture = new groovy.json.JsonSlurper().parse(
                layout.buildDirectory.file('diagnostics/resize.json').get().asFile)
        def resized = capture.frames.find { it.frameSequence >= 5 }
        if (resized == null || resized.graph.width != 960 || resized.graph.height != 540) {
            throw new GradleException('Diagnostics resize capture did not publish 960x540 graph metadata')
        }
        def shadow = resized.graph.passes.find { it.name == 'DirectionalShadowPass' }
        if (shadow == null || shadow.width != 2048 || shadow.height != 2048) {
            throw new GradleException('Fixed shadow target changed during diagnostics resize')
        }
    }
}

tasks.register('runDiagnosticsFailureIntegration', JavaExec) {
    group = 'verification'
    description = 'Triggers real pass-recording and active-query command failures, then verifies recovery.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.demo.DiagnosticsFailureIntegration'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    workingDir = projectDir
    args 'build/diagnostics/failure.json'
    outputs.file layout.buildDirectory.file('diagnostics/failure.json')
    outputs.upToDateWhen { false }
    mustRunAfter 'runDiagnosticsResizeIntegration'
    doLast {
        def capture = new groovy.json.JsonSlurper().parse(
                layout.buildDirectory.file('diagnostics/failure.json').get().asFile)
        def failed = capture.frames.findAll { it.frameSequence in [1, 3] }
        if (capture.frames.size() != 6 || failed.size() != 2
                || failed.any { it.complete || it.passes.any { pass -> pass.gpuStatus != 'FAILED' } }) {
            throw new GradleException('Diagnostics failure capture lacks real callback/command failures')
        }
        if (!capture.frames.any { it.frameSequence > 3 && it.complete }) {
            throw new GradleException('Diagnostics failure integration did not recover on a later frame')
        }
        if (capture.metadata.engineVersion != project.version.toString()
                || capture.metadata.glVendor == 'unavailable') {
            throw new GradleException('Diagnostics failure capture lacks build/OpenGL metadata')
        }
        if (capture.resources.live.any { it.containsKey('nativeId') }) {
            throw new GradleException('Default diagnostics export leaked native GL ids')
        }
    }
}

