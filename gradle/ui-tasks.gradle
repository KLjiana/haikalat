tasks.register('runMarkdownTextIntegration', JavaExec) {
    group = 'verification'
    description = 'Runs the hidden deterministic Markdown and text-effect pixel proof.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = markdownTextDemoMainClass
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    workingDir = projectDir
    args '--deterministic', '--frames=30', '--size=1180x760', '--verify-pixels'
    mustRunAfter 'runUiTextIntegration'
}

tasks.register('runModernUiIntegration', JavaExec) {
    group = 'verification'
    description = 'Runs the modern game menu with deterministic interaction and pixel proof.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = modernUiDemoMainClass
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    workingDir = projectDir
    args '--deterministic', '--frames=90', '--size=1280x720',
            '--compositor=on', '--backdrop=off', '--ui-vfx=on'
    mustRunAfter 'runUiResizeIntegration'
}

tasks.register('runUiIntegration', JavaExec) {
    group = 'verification'
    description = 'Runs UiDemo hidden with visual/layout animation, scripted controls, resize and pixel proof.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = uiDemoMainClass
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    workingDir = projectDir
    args '--deterministic', '--frames=12', '--resize=4:720x480',
            '--content-scale=1.25x1.5', '--verify-pixels'
    mustRunAfter 'glSmoke', 'runStressCubeIntegration'
}

tasks.register('runUiSdfIntegration', Test) {
    group = 'verification'
    description = 'Runs the real-GL SDF rounded-shape and analytic coverage proof.'
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'haikalat.glSmoke', 'true'
    filter {
        includeTestsMatching(
                'com.kaleblangley.haikalat.integration.UiRendererGlTest.sdfRoundedRectProducesAnalyticCoverageAndKeepsQuadPathState')
    }
    mustRunAfter 'glSmoke'
}

tasks.register('runUiResizeIntegration', JavaExec) {
    group = 'verification'
    description = 'Runs deterministic UI resize, non-integer content scale and nested clipping checks.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = uiDemoMainClass
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    workingDir = projectDir
    args '--deterministic', '--frames=16', '--resize=2:640x400',
            '--resize=7:1024x640', '--resize=12:800x520',
            '--content-scale=1.375x1.625', '--verify-pixels'
    mustRunAfter 'runUiIntegration'
}

tasks.register('runUiAsyncIntegration', JavaExec) {
    group = 'verification'
    description = 'Runs three-slot async UI snapshot exchange and owner-thread cleanup checks.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.demo.ui.UiAsyncIntegration'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    workingDir = projectDir
    mustRunAfter 'runUiResizeIntegration'
}

tasks.register('runUiTextIntegration', JavaExec) {
