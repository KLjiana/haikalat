def uiEvidenceTasks = uiCompositorCases.keySet().toList() + uiConsumers + uiGuards
def uiReport = tasks.register('writeUiCompositorVerificationReport') {
    group = 'verification'
    description = 'Writes final UI outcomes after test, process and GL-log gates, including dependency failures.'
    mustRunAfter uiEvidenceTasks
    doLast {
        File directory = layout.buildDirectory.dir("reports/ui-compositor-v0260/${runId}").get().asFile
        directory.mkdirs()
        Set<String> selected = gradle.taskGraph.allTasks*.name as Set
        Map finalCandidate = snapshot()
        boolean stable = !initialCandidate.isEmpty() && initialCandidate == finalCandidate
        List entries = uiEvidenceTasks.findAll { selected.contains(it) }.collect { String name ->
            Task leaf = tasks.named(name).get()
            List required = uiCompositorCases[name] ?: []
            Map actual = observed[name] ?: [:]
            if(name=='runUiCompositorIntegration') {
                required=['layers','content-blur','backdrop-blur','cache-lifecycle']
                actual=[:]
                required.each { id ->
                    File evidence=new File(uiDemoOutput,"${id}/evidence.json")
                    if(evidence.isFile()) {
                        def proof=new JsonSlurper().parse(evidence)
                        actual[id]=[total:proof.attemptedFrames,failed:proof.status=='PASS'?0:1,skipped:0]
                    }
                }
            }
            if(name in ['runVlsIntegration','runModernUiIntegration']) {
                required=[name=='runVlsIntegration'?'VLS_INTERACTION_REPLAY':'MODERN_UI_PIXEL_REPLAY'];actual=[:]
                File log=layout.buildDirectory.file("reports/gl/${name}.log").get().asFile
                if(log.isFile()) {
                    String content=log.getText('UTF-8')
                    boolean proof=name=='runVlsIntegration'?(content=~ /VlsDemo \| frames=100 \| framebuffer=1100x720 .*interactionProof=true/).find():
                            (content=~ /ModernUiDemo \| frames 90 \| framebuffer 1280x720 .*layers 1 .*non-clear [1-9][0-9]*/).find()
                    if(proof)actual[required.first()]=[total:1,failed:0,skipped:0]
                }
            }
            String outcome = taskOutcome(leaf)
            String tests = required.isEmpty() ? 'NOT_APPLICABLE' : verdict(leaf.state.failure != null,
                    leaf.state.executed, leaf.state.skipped, required, actual)
            boolean gl = (uiCompositorCases.containsKey(name) && name != 'uiCompositorJvmVerification') || uiConsumers.contains(name)
            String logAudit = gl ? (leaf.extensions.extraProperties.has('glLogAuditStatus') ?
                    leaf.extensions.extraProperties.get('glLogAuditStatus').toString() : 'NOT_RUN') : 'NOT_APPLICABLE'
            if (outcome == 'PASS' && ((!required.isEmpty() && tests != 'PASS') || (gl && logAudit != 'PASS'))) outcome = 'INCOMPLETE'
            Map entry = [task: name, status: outcome, testStatus: tests, glLogAudit: logAudit,
                requiredCases: required, results: actual, execution: leaf.state.didWork ? 'FRESH' : 'NO_FRESH_WORK',
                failure: leaf.state.failure?.toString()]
            new File(directory,"${name}.json").setText(JsonOutput.prettyPrint(JsonOutput.toJson(entry))+'\n','UTF-8')
            if(leaf instanceof Test&&leaf.state.executed) {
                copy {from leaf.reports.junitXml.outputLocation;include '*.xml';into new File(directory,"junit/${name}")}
            } else if(leaf instanceof JavaExec&&leaf.state.executed) {
                File log=layout.buildDirectory.file("reports/gl/${name}.log").get().asFile
                if(log.isFile())copy {from log;into new File(directory,'logs')}
            }
            entry
        }
        List failures = gradle.taskGraph.allTasks.findAll { it.state.failure != null }.collect { [task: it.name, failure: it.state.failure.toString()] }
        String status = !stable ? 'SOURCE_CHANGED' : entries.isEmpty() ? 'NOT_RUN' :
                (!failures.isEmpty() || entries.any { it.status != 'PASS' }) ? 'FAIL' : 'PASS'
        Map report = [schemaVersion: 2, runId: runId, status: status, candidate: initialCandidate,
            finalCandidate: finalCandidate, candidateStable: stable, entries: entries, failures: failures,
            environment: [os: System.getProperty('os.name'), java: System.getProperty('java.version')],
            featureAcceptance: 'SCOPED_AUTOMATED_CHECKPOINT', performance: 'NOT_EVALUATED',
            humanVisualAcceptance: 'NOT_EVALUATED', releaseReady: false]
        new File(directory,'summary.json').setText(JsonOutput.prettyPrint(JsonOutput.toJson(report))+'\n','UTF-8')
        if(status != 'PASS') throw new GradleException('UI scoped evidence: '+status+'; report='+directory)
    }
}
