tasks.named('runUiCompositorIntegration') {
    dependsOn 'captureUiCompositorCandidate'
    mustRunAfter 'uiCompositorVerification'
    doFirst { args '--output='+uiDemoOutput.absolutePath }
    doLast {
        ['layers','content-blur','backdrop-blur','cache-lifecycle'].each { name ->
            File evidence=new File(uiDemoOutput,"${name}/evidence.json")
            if(!evidence.isFile())throw new GradleException('Missing compositor case: '+name)
            def result=new JsonSlurper().parse(evidence)
            if(result.status!='PASS'||result.case!=name||result.attemptedFrames!=96||result.markerHits<1||!result.nativePresentationVerified)
                throw new GradleException('Incomplete compositor case: '+name)
        }
    }
}
