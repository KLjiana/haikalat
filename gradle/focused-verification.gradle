tasks.register('captureUiCompositorCandidate') {
    doLast {
        initialCandidate = snapshot()
        println "UI_COMPOSITOR_RUN_ID=${runId}"
        File inputs=layout.buildDirectory.dir("reports/ui-compositor-v0260/${runId}/inputs").get().asFile
        inputs.mkdirs()
        List<String> paths=gitText(['ls-files','-z','--cached','--others','--exclude-standard']).split('\u0000').findAll { !it.isEmpty() }.unique().sort()
        List identities=paths.collect { path ->
            File source=file(path)
            [path:path,bytes:source.isFile()?source.length():null,sha256:source.isFile()?MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString():'MISSING']
        }
        new File(inputs,'identity.json').setText(JsonOutput.prettyPrint(JsonOutput.toJson([candidate:initialCandidate,files:identities]))+'\n','UTF-8')
        new File(inputs,'working-tree.patch').setText(gitText(['-c','core.safecrlf=false','diff','HEAD','--binary','--no-ext-diff']),'UTF-8')
        gitText(['ls-files','-z','--others','--exclude-standard']).split('\u0000').findAll { !it.isEmpty() }.each { path ->
            File source=file(path),copy=new File(inputs,'untracked/'+path)
            if(source.isFile()){copy.parentFile.mkdirs();java.nio.file.Files.copy(source.toPath(),copy.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)}
        }
    }
}
