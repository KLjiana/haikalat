// UI compositor leaves use the same fresh execution and required-case event contracts.
def uiCompositorCases = [uiCompositorJvmVerification: ['UiLayerFrameTest', 'UiCompositorFoundationTest', 'UiSystemTest', 'UiPainterTest', 'UiInputRouterTest', 'UiPublicApiSurfaceTest'],
    uiCompositorGlVerification: ['UiCompositorGlTest', 'UiCompositorLifecycleGlTest', 'UiCompositorSourceGlTest', 'UiRendererGlTest', 'RenderTargetManagerGlTest'],
    uiCompositorCacheSoak: ['UiCompositorCacheSoakGlTest']]
uiCompositorCases.each { String taskName, List<String> required ->
    registerTests(taskName, required, taskName != 'uiCompositorJvmVerification')
    String status = 'NOT_RUN'
    tasks.named(taskName, Test) {
        setDependsOn(['captureUiCompositorCandidate', 'testClasses'])
        afterSuite { descriptor, result ->
            if (descriptor.parent == null) {
                boolean stable = initialCandidate == snapshot()
                status = verdict(result.failedTestCount > 0, true, false, required, observed[taskName])
                if (!stable) status = 'SOURCE_CHANGED'
                File output = layout.buildDirectory.file("reports/ui-compositor-v0260/${runId}/${taskName}.json").get().asFile
                output.parentFile.mkdirs()
                output.setText(JsonOutput.prettyPrint(JsonOutput.toJson([schemaVersion: 1, runId: runId,
                    task: taskName, status: 'PENDING_TASK_GATES', testStatus: status, execution: 'FRESH', requiredCases: required,
                    results: observed[taskName], candidate: initialCandidate, candidateStable: stable,
                    performance: 'NOT_EVALUATED', featureAcceptance: taskName == 'uiCompositorJvmVerification' ? 'INTERNAL_CPU_CHECKPOINT' : 'INTERNAL_GL_CHECKPOINT', releaseReady: false])) + '\n', 'UTF-8')
            }
        }
        doLast { if (status != 'PASS') throw new GradleException('UI compositor contracts incomplete: ' + status) }
    }
}

