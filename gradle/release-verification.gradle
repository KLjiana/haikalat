def sha256 = { byte[] bytes ->
    MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
}

def runGit = { List<String> arguments ->
    List<String> command = ['git', '-c',
                            "safe.directory=${projectDir.toString().replace('\\', '/')}".toString(),
                            '-c', 'core.excludesFile=']
    command.addAll(arguments.collect { it.toString() })
    Process process = new ProcessBuilder(command).directory(projectDir)
            .redirectErrorStream(true).start()
    String output = process.inputStream.getText('UTF-8')
    int exit = process.waitFor()
    if (exit != 0) {
        throw new GradleException("Git command failed (${arguments.join(' ')}):\n${output.trim()}")
    }
    output
}

def sha256GitOutput = { List<String> arguments ->
    List<String> command = ['git', '-c',
                            "safe.directory=${projectDir.toString().replace('\\', '/')}".toString(),
                            '-c', 'core.excludesFile=']
    command.addAll(arguments.collect { it.toString() })
    Process process = new ProcessBuilder(command).directory(projectDir).start()
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    byte[] buffer = new byte[64 * 1024]
    int count
    while ((count = process.inputStream.read(buffer)) != -1) {
        digest.update(buffer, 0, count)
    }
    String error = process.errorStream.getText('UTF-8')
    int exit = process.waitFor()
    if (exit != 0) {
        throw new GradleException("Git command failed (${arguments.join(' ')}):\n${error.trim()}")
    }
    digest.digest().encodeHex().toString()
}

