    [manifestResourceTree('src/main/resources'), fileTree('src/demo/resources')].each { tree ->
        tree.files.each { resource ->
            result.add(project.relativePath(resource).replace('\\', '/'))
        }
    }
    result
}

def purposeFor = { String path ->
    String extension = path.lastIndexOf('.') >= 0
            ? path.substring(path.lastIndexOf('.') + 1).toLowerCase(Locale.ROOT) : ''
    switch (extension) {
        case 'vert': case 'frag': case 'comp': return 'Runtime shader'
        case 'png': case 'jpg': case 'jpeg': case 'hdr': return 'Texture/image asset'
        case 'gltf': case 'glb': case 'obj': return 'Model asset'
        case 'ttf': case 'otf': return 'Font asset'
        case 'properties': return 'Runtime configuration'
        default: return 'Runtime resource'
    }
}

def writeMissingAssetSuggestions = { Set<String> missing ->
    File output = reportDirectory.get().file('missing-assets.tsv').asFile
    output.parentFile.mkdirs()
    List<String> lines = ['# path\tpurpose\towner/source URL\tlicense\tversion/date\tsha256\ttransformation\tredistributable']
    missing.sort().each { path ->
        lines.add([path, purposeFor(path), 'TODO', 'TODO', 'TODO',
                   sha256(file(path).bytes), 'TODO', 'TODO'].join('\t'))
    }
    output.setText(lines.join('\n') + '\n', 'UTF-8')
}

def parseManifest = { File manifest ->
    if (!manifest.isFile()) throw new GradleException("Missing asset manifest: ${manifest}")
    Map<String, List<String>> records = new LinkedHashMap<>()
    Map<String, String> caseFolded = [:]
    List<String> failures = []
    manifest.readLines('UTF-8').eachWithIndex { line, lineIndex ->
        if (!line || line.startsWith('#')) return
        List<String> fields = line.split('\t', -1) as List<String>
        int row = lineIndex + 1
        if (fields.size() != 8 || fields.any { it.isBlank() }) {
            failures.add("row ${row}: expected exactly 8 non-empty fields")
            return
        }
        String path = fields[0]
        if (path.contains('\\') || path.startsWith('/') || path ==~ /^[A-Za-z]:.*/
                || path.split('/').contains('..')) {
            failures.add("row ${row}: unsafe or non-canonical path '${path}'")
        }
        String folded = path.toLowerCase(Locale.ROOT)
        if (caseFolded.put(folded, path) != null) {
            failures.add("row ${row}: duplicate path ignoring case '${path}'")
        }
        if (records.put(path, fields) != null) failures.add("row ${row}: duplicate path '${path}'")
        if (!(fields[5] ==~ /[0-9a-f]{64}/)) {
            failures.add("row ${row}: sha256 must be 64 lowercase hexadecimal characters")
        }
        if (fields[7] != 'yes') failures.add("row ${row}: redistributable must be 'yes'")
        if (fields[2] != 'Haikalat project' && fields[3] == 'project license') {
            failures.add("row ${row}: third-party resource must name an explicit license")
        }
    }
    if (!failures.isEmpty()) {
        throw new GradleException('Invalid asset manifest:\n- ' + failures.join('\n- '))
    }
    records
}

def parseGlPolicy = {
    List<Map<String, Object>> policies = []
    List<String> failures = []
    glPolicyFile.readLines('UTF-8').eachWithIndex { line, index ->
        if (!line || line.startsWith('#')) return
        List<String> fields = line.split('\t', -1) as List<String>
        if (fields.size() != 13 || fields.any { it.isBlank() }) {
            failures.add("row ${index + 1}: expected exactly 13 non-empty fields")
            return
        }
        LocalDate expiry
        int maximum
        int messageId
        try {
            expiry = LocalDate.parse(fields[11])
            maximum = Integer.parseInt(fields[12])
            messageId = Integer.parseInt(fields[5])
            if (maximum <= 0) throw new IllegalArgumentException('non-positive count')
            fields[0].matches(fields[0]); fields[1].matches(fields[1])
            fields[6].matches(fields[6]); fields[7].matches(fields[7])
        } catch (RuntimeException invalid) {
            failures.add("row ${index + 1}: invalid regex/date/count: ${invalid.message}")
            return
        }
        policies.add([vendor: fields[0], renderer: fields[1], severity: fields[2],
                      source: fields[3], type: fields[4], id: messageId,
                      entry: fields[6], message: fields[7], rationale: fields[8], owner: fields[9],
                      added: fields[10], expiry: expiry, maximum: maximum, row: index + 1])
    }
    if (!failures.isEmpty()) throw new GradleException('Invalid GL debug policy:\n- ' + failures.join('\n- '))
    policies
}

def auditGlText = { String entry, String textValue, List<Map<String, Object>> policies ->
    String vendor = 'unavailable'
    String renderer = 'unavailable'
    def identity = textValue =~ /OpenGL debug output enabled vendor=(.*?) renderer=(.*?) version=/
    if (identity.find()) {
        vendor = identity.group(1).trim()
        renderer = identity.group(2).trim()
    }
    List<Map<String, Object>> messages = []
    List<String> violations = []
    if (textValue =~ /GL_INVALID_[A-Z_]+/) {
        (textValue =~ /GL_INVALID_[A-Z_]+/).each { violations.add("${entry}: ${it}") }
    }
    def matcher = textValue =~ /OpenGL ([A-Z_]+) \[(HIGH|MEDIUM|LOW|NOTIFICATION)] source=([A-Z_]+) id=(\d+): ([^\r\n<]*)/
    Map<Integer, Integer> counts = [:].withDefault { 0 }
    matcher.each { full, type, severity, source, idText, message ->
        int id = Integer.parseInt(idText)
        Map<String, Object> found = policies.find { policy ->
            vendor ==~ policy.vendor && renderer ==~ policy.renderer
                    && severity == policy.severity && source == policy.source
                    && type == policy.type && id == policy.id
                    && entry ==~ policy.entry && message.trim() ==~ policy.message
                    && !LocalDate.now().isAfter(policy.expiry as LocalDate)
        }
        Map<String, Object> item = [entry: entry, vendor: vendor, renderer: renderer,
                                    severity: severity, source: source, type: type,
                                    id: id, message: message.trim(), authorized: found != null]
        messages.add(item)
        if (severity in ['HIGH', 'MEDIUM']) {
            if (found == null) {
                violations.add("${entry}: unauthorized ${severity} ${source}/${type} id=${id}: ${message.trim()}")
            } else {
                counts[found.row as Integer]++
                if (counts[found.row as Integer] > (found.maximum as Integer)) {
                    violations.add("${entry}: policy row ${found.row} exceeded max count ${found.maximum}")
                }
            }
        }
    }
    [messages: messages, violations: violations, vendor: vendor, renderer: renderer]
}

def auditGlFiles = { Map<String, File> inputs ->
    List<Map<String, Object>> policies = parseGlPolicy()
    List<Map<String, Object>> messages = []
    List<String> violations = []
    inputs.sort { it.key }.each { entry, input ->
        if (!input.isFile()) return
        def result = auditGlText(entry, input.getText('UTF-8'), policies)
        messages.addAll(result.messages)
        violations.addAll(result.violations)
    }
    [messages: messages, violations: violations]
}

tasks.register('suggestAssetManifestEntries') {
    group = 'verification'
    description = 'Writes non-authoritative TODO rows for resources missing from assets.tsv.'
    inputs.files manifestResourceTree('src/main/resources'), fileTree('src/demo/resources'), manifestFile
    outputs.file reportDirectory.map { it.file('missing-assets.tsv') }
    doLast {
        Map<String, List<String>> records = parseManifest(manifestFile)
        writeMissingAssetSuggestions(resourcePaths() - records.keySet())
    }
}

tasks.register('assetManifestGuard') {
    group = 'verification'
    description = 'Strictly verifies resource provenance, canonical paths and lowercase SHA-256 values.'
    inputs.files manifestResourceTree('src/main/resources'), fileTree('src/demo/resources'), manifestFile
    doLast {
        Map<String, List<String>> records = parseManifest(manifestFile)
        Set<String> resources = resourcePaths()
        Set<String> missing = resources - records.keySet()
        Set<String> stale = records.keySet() - resources
        if (!missing.isEmpty()) writeMissingAssetSuggestions(missing)
        List<String> failures = []
        if (!missing.isEmpty()) failures.add("missing=${missing.sort()}")
        if (!stale.isEmpty()) failures.add("stale=${stale.sort()}")
        records.each { path, fields ->
            if (!file(path).isFile()) return
            String actual = sha256(file(path).bytes)
            if (actual != fields[5]) {
                failures.add("hash path=${path} expected=${fields[5]} actual=${actual}")
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException('Asset manifest verification failed:\n- ' + failures.join('\n- '))
        }
    }
}

tasks.register('vfxAssetGuard') {
    group = 'verification'
    description = 'Verifies the unified VFX resource tree, naming rules and direct resource references.'
    dependsOn 'processResources'
    inputs.files fileTree('src/main/resources/vfx')
    inputs.files fileTree('src/main/java') { include '**/*.java' },
            fileTree('src/demo/java') { include '**/*.java' },
            fileTree('src/main/resources') { include '**/*.properties', '**/*.json' },
            fileTree('src/demo/resources') { include '**/*.properties', '**/*.json' }
    doLast {
        File resources = layout.buildDirectory.dir('resources/main').get().asFile
        File vfxRoot = file('src/main/resources/vfx')
        File packagedVfxRoot = new File(resources, 'vfx')
        ['runtime', 'source'].each { obsoleteLayer ->
            if (new File(vfxRoot, obsoleteLayer).exists()
                    || new File(packagedVfxRoot, obsoleteLayer).exists()) {
                throw new GradleException("Obsolete VFX layer still exists: vfx/${obsoleteLayer}")
            }
        }

        List<String> invalidPackages = []
        if (vfxRoot.isDirectory()) {
            vfxRoot.eachDirRecurse { directory ->
                String relativeVfxPath = vfxRoot.toPath()
                        .relativize(directory.toPath())
                        .toString()
                        .replace('\\', '/')
                if (relativeVfxPath != 'licenses'
                        && !relativeVfxPath.startsWith('licenses/')
                        && !(directory.name ==~ /[a-z0-9]+(?:_[a-z0-9]+)*/)) {
                    invalidPackages.add(project.relativePath(directory))
                }
            }
        }
        if (!invalidPackages.isEmpty()) {
            throw new GradleException("VFX package directories must use lowercase snake_case: "
                    + invalidPackages.sort())
        }

        List<String> invalidDevelopmentEssentialsImages = fileTree(vfxRoot) {
            include '**/development_essentials/**/*.png'
        }.files.findAll { image ->
            !(image.name ==~ /[a-z0-9]+(?:_[a-z0-9]+)*\.png/)
        }.collect { project.relativePath(it) }.sort()
        if (!invalidDevelopmentEssentialsImages.isEmpty()) {
            throw new GradleException("Development Essentials image files must use lowercase snake_case: "
                    + invalidDevelopmentEssentialsImages)
        }

        Set<String> sourceFiles = fileTree(vfxRoot).files.findAll { it.isFile() }.collect {
            vfxRoot.toPath().relativize(it.toPath()).toString().replace('\\', '/')
        } as Set<String>
        Set<String> packagedFiles = packagedVfxRoot.isDirectory()
                ? fileTree(packagedVfxRoot).files.findAll { it.isFile() }.collect {
                    packagedVfxRoot.toPath().relativize(it.toPath()).toString().replace('\\', '/')
                } as Set<String>
                : [] as Set<String>
        if (sourceFiles != packagedFiles) {
            throw new GradleException("Packaged VFX tree differs from source resources: missing="
                    + (sourceFiles - packagedFiles).sort() + ", unexpected="
                    + (packagedFiles - sourceFiles).sort())
        }

        String references = [
                fileTree('src/main/java') { include '**/*.java' },
                fileTree('src/demo/java') { include '**/*.java' },
                fileTree('src/main/resources') { include '**/*.properties', '**/*.json' },
                fileTree('src/demo/resources') { include '**/*.properties', '**/*.json' }
        ].collectMany { it.files }.collect { it.getText('UTF-8') }.join('\n')
        Set<String> directReferences = []
        def referenceMatcher = references =~ /["'](\/vfx\/[^"']+)["']/
        referenceMatcher.each { match -> directReferences.add(match[1]) }
        List<String> missingReferences = directReferences.findAll {
            !new File(file('src/main/resources'), it.substring(1)).isFile()
        }.sort()
        if (!missingReferences.isEmpty()) {
            throw new GradleException("Missing directly referenced VFX resources: ${missingReferences}")
        }
        long packagedBytes = fileTree(packagedVfxRoot).files.findAll { it.isFile() }.sum(0L) { it.length() }
        logger.lifecycle("Packaged VFX assets: ${packagedFiles.size()} files, ${packagedBytes} bytes")
    }
}

