# Temporal inputs frozen before the first scene-sequence candidate. Thresholds inherit quality.properties.
schema=1
freezeFirstFrame=120
stableFirstFrame=148
lightOffFrame=180
settledFrame=192
stableFreezeCameraAndWorld=true
forest_morning.lightIndex=0
# At frozen street frame 119: original lamp 54 is at (-5.7, 4.36, -10), in front of the camera.
town_night.lightIndex=54
tavern_threshold.lightIndex=81
medium_lab.lightIndex=1
# Full sampled ROI; no result-dependent masks or pixel exclusion.
roiPolicy=full-quality-roi
stabilityMetric=population-stddev-of-roi-mean-luminance
# Per-pixel extrema are also saved; TAA subpixel geometry edges require separate visual review.
recoveryMetric=sum-absolute-rgb-counterfactual-difference
counterfactualPolicy=photometric-ablation-with-matched-history-and-reactive
