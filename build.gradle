tasks.register('runDiagnosticsIntegration', JavaExec) {
    group = 'verification'
    description = 'Runs the main Demo with DETAILED diagnostics and exports schema v1 JSON.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.demo.LearnOpenGlDemo'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    workingDir = projectDir
    args '--deterministic', '--quiet', '--frames=12', '--diagnostics=detailed', '--diagnostics-panel',
            '--diagnostics-verify-cleanup',
            '--diagnostics-export=build/diagnostics/integration.json'
    outputs.file layout.buildDirectory.file('diagnostics/integration.json')
    outputs.upToDateWhen { false }
    mustRunAfter 'runDemoIntegration'
    doLast {
        File output = layout.buildDirectory.file('diagnostics/integration.json').get().asFile
        def capture = new groovy.json.JsonSlurper().parse(output)
        if (capture.schemaVersion != 1 || capture.frames.size() != 12) {
            throw new GradleException('Diagnostics integration did not export 12 schema-v1 frames')
        }
        if (capture.frames.any { it.graph == null || it.passes.isEmpty()
                || it.scene == null || it.ui == null || it.upload == null }) {
            throw new GradleException('Diagnostics integration is missing graph/pass/subsystem data')
        }
        if (capture.frames.any { frame -> frame.passes.any { pass ->
            pass.gpuStatus != 'AVAILABLE' && pass.gpuNanos != null
        } }) {
            throw new GradleException('Unavailable GPU samples must export null durations')
        }
        if (capture.resources.live.isEmpty()) {
            throw new GradleException('Detailed capture did not include tracked live resources')
        }
        if (capture.messages.entries.any { it.severity == 'HIGH' }) {
            throw new GradleException('Diagnostics integration captured a HIGH OpenGL error')
        }
    }
}

