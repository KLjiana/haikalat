tasks.register('runPreviewIntegration', JavaExec) {
    group = 'verification'
    description = 'Runs F2 graph-resource selection, GPU preview, freeze-safe summary and JSON export.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.demo.LearnOpenGlDemo'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    workingDir = projectDir
    args '--deterministic', '--quiet', '--frames=16', '--aa=MSAA', '--diagnostics=detailed',
            '--diagnostics-panel', '--preview=GeometryPass/sceneColor',
            '--diagnostics-export=build/diagnostics/preview-integration.json'
    outputs.file layout.buildDirectory.file('diagnostics/preview-integration.json')
    outputs.upToDateWhen { false }
    mustRunAfter 'runDiagnosticsFailureIntegration'
    doLast {
        def output = layout.buildDirectory.file('diagnostics/preview-integration.json').get().asFile
        def capture = new groovy.json.JsonSlurper().parse(output)
        def live = capture.frames.findAll { it.preview?.status == 'LIVE' }
        if (live.isEmpty() || live.any { it.preview.frameDraws != 1 || it.preview.frameBlits > 1 }) {
            throw new GradleException('Preview integration did not publish bounded live GPU work')
        }
        if (capture.frames.any { it.preview == null }) {
            throw new GradleException('Detailed preview integration omitted PreviewSummary')
        }
        if (capture.frames.any { frame -> frame.graph.passes.any { it.name.contains('Preview') } }) {
            throw new GradleException('Preview changed RenderGraph topology')
        }
        String json = output.getText('UTF-8')
        if (json.contains('textureId') || json.contains('pixels')) {
            throw new GradleException('Preview export leaked native texture identity or pixels')
        }
    }
}

