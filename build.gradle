plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

group = 'com.kaleblangley'
version = '0.7.0-SNAPSHOT'

repositories {
    mavenCentral()
}

project.ext.lwjglVersion = "3.3.3"
project.ext.jomlVersion = "1.10.9"
project.ext.lwjglNatives = detectLwjglNatives()

def generatedProceduralJava = layout.buildDirectory.dir('generated/sources/proceduralShaders/java')
def generatedProceduralResources = layout.buildDirectory.dir('generated/resources/proceduralShaders')

def lwjglModules = [
        "lwjgl",
        "lwjgl-assimp",
        "lwjgl-glfw",
        "lwjgl-opengl",
        "lwjgl-stb"
]

static String detectLwjglNatives() {
    String os = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT)
    String arch = System.getProperty("os.arch").toLowerCase(java.util.Locale.ROOT)
    boolean arm64 = arch in ["aarch64", "arm64"]
    boolean x86 = arch in ["x86", "i386", "i486", "i586", "i686"]

    if (os.contains("win")) {
        return x86 ? "natives-windows-x86" : arm64 ? "natives-windows-arm64" : "natives-windows"
    }
    if (os.contains("mac") || os.contains("darwin")) {
        return arm64 ? "natives-macos-arm64" : "natives-macos"
    }
    if (os.contains("linux")) {
        return arm64 ? "natives-linux-arm64" : "natives-linux"
    }
    throw new GradleException("Unsupported OS for LWJGL natives: $os")
}

sourceSets {
    shaderGenerator {
        java.srcDir 'src/shaderGenerator/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    demo {
        java.srcDir generatedProceduralJava
        resources.srcDir generatedProceduralResources
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    shaderGeneratorImplementation.extendsFrom implementation
    shaderGeneratorRuntimeOnly.extendsFrom runtimeOnly
    demoImplementation.extendsFrom implementation
    demoRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    lwjglModules.each { module ->
        implementation "org.lwjgl:$module"
        runtimeOnly "org.lwjgl:$module::$lwjglNatives"
    }

    implementation "org.joml:joml:${jomlVersion}"

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation sourceSets.demo.output
}

test {
    useJUnitPlatform()
    systemProperty 'haikalat.glSmoke', System.getProperty('haikalat.glSmoke', 'false')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('generateProceduralShaders', JavaExec) {
    group = 'build'
    description = 'Generates shape-specialized procedural stress shaders and their Java catalog.'
    dependsOn shaderGeneratorClasses
    classpath = sourceSets.shaderGenerator.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.tools.ProceduralShaderGenerator'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    args generatedProceduralJava.get().asFile.absolutePath,
            generatedProceduralResources.get().asFile.absolutePath
    inputs.files(fileTree('src/shaderGenerator'),
            file('src/main/java/com/kaleblangley/haikalat/core/mesh/BuiltinMeshData.java'))
    outputs.dirs(generatedProceduralJava, generatedProceduralResources)
}

tasks.named('compileDemoJava') {
    dependsOn 'generateProceduralShaders'
}
tasks.named('processDemoResources') {
    dependsOn 'generateProceduralShaders'
}

tasks.register('runDemoIntegration', JavaExec) {
    group = 'verification'
    description = 'Runs the hidden deterministic baseline scene for a finite number of frames.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.demo.LearnOpenGlDemo'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    args '--deterministic', '--frames=8', '--aa=FXAA'
}

tasks.register('runDemoResizeIntegration', JavaExec) {
    group = 'verification'
    description = 'Runs the hidden baseline scene and verifies a deterministic resize.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.demo.LearnOpenGlDemo'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    args '--deterministic', '--frames=8', '--aa=FXAA', '--resize=4:960x540'
}

tasks.register('runAsyncIntegration', JavaExec) {
    group = 'verification'
    description = 'Runs the async upload/render-thread demo hidden for a finite number of frames.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.demo.async.AsyncDemo'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    args '--deterministic', '--frames=8'
}

tasks.register('runStressTriangleIntegration', JavaExec) {
    group = 'verification'
    description = 'Renders 100000 instanced triangles in a hidden finite stress run.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.demo.stress.StressDemo'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    args '--deterministic', '--frames=2', '--shape=triangle', '--instances=100000'
}

tasks.register('runStressCubeIntegration', JavaExec) {
    group = 'verification'
    description = 'Renders 100000 instanced cubes in a hidden finite stress run.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.demo.stress.StressDemo'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    args '--deterministic', '--frames=2', '--shape=cube', '--instances=100000'
}

tasks.register('runStressQuadIntegration', JavaExec) {
    group = 'verification'
    description = 'Renders 100000 GPU-driven quads in a hidden finite stress run.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.demo.stress.StressDemo'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    args '--deterministic', '--frames=2', '--shape=quad', '--instances=100000'
}

tasks.register('runStressIndexedCubeIntegration', JavaExec) {
    group = 'verification'
    description = 'Renders 100000 indexed procedural cubes with the generated uint8 EBO.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.demo.stress.StressDemo'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    args '--deterministic', '--frames=2', '--shape=cube', '--instances=100000', '--mode=indexed'
}

tasks.register('runStressIndexedSsboCubeIntegration', JavaExec) {
    group = 'verification'
    description = 'Renders 100000 indexed cubes from the compact 16-byte instance SSBO.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.demo.stress.StressDemo'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    args '--deterministic', '--frames=2', '--shape=cube', '--instances=100000', '--mode=indexed-ssbo'
}

tasks.register('runStressIntegration') {
    group = 'verification'
    description = 'Runs 100000-instance triangle, quad and cube GPU stress checks.'
    dependsOn 'runStressTriangleIntegration', 'runStressQuadIntegration', 'runStressCubeIntegration'
}

tasks.register('glSmoke', Test) {
    group = 'verification'
    description = 'Runs the complete test suite with the opt-in real OpenGL smoke tests enabled.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'haikalat.glSmoke', 'true'
}

tasks.register('runEmptyWindowIntegration', JavaExec) {
    group = 'verification'
    description = 'Creates a hidden OpenGL window, presents three frames, and issues no draw commands.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.demo.EmptyWindowDemo'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    args '--deterministic', '--frames=3'
}

tasks.register('localGlVerification') {
    group = 'verification'
    description = 'Runs GL smoke tests and all deterministic demo integrations.'
    dependsOn 'glSmoke', 'runDemoIntegration', 'runDemoResizeIntegration', 'runAsyncIntegration',
            'runEmptyWindowIntegration',
            'runStressTriangleIntegration', 'runStressCubeIntegration',
            'runStressIndexedCubeIntegration', 'runStressIndexedSsboCubeIntegration'
    dependsOn 'runStressQuadIntegration'
}

tasks.named('runDemoIntegration') {
    mustRunAfter 'glSmoke'
}
tasks.named('runDemoResizeIntegration') {
    mustRunAfter 'runDemoIntegration'
}
tasks.named('runAsyncIntegration') {
    mustRunAfter 'runDemoResizeIntegration'
}
tasks.named('runStressTriangleIntegration') {
    mustRunAfter 'runEmptyWindowIntegration'
}
tasks.named('runEmptyWindowIntegration') {
    mustRunAfter 'runAsyncIntegration'
}
tasks.named('runStressCubeIntegration') {
    mustRunAfter 'runStressIndexedSsboCubeIntegration'
}
tasks.named('runStressQuadIntegration') {
    mustRunAfter 'runStressTriangleIntegration'
}
tasks.named('runStressIndexedCubeIntegration') {
    mustRunAfter 'runStressQuadIntegration'
}
tasks.named('runStressIndexedSsboCubeIntegration') {
    mustRunAfter 'runStressIndexedCubeIntegration'
}

tasks.register('runAsyncDemoIntegration') {
    group = 'verification'
    description = 'Compatibility alias for runAsyncIntegration.'
    dependsOn 'runAsyncIntegration'
}

def registerDemoApplication = { taskName, descriptionText, mainClassName, launchArgs ->
    tasks.register(taskName, JavaExec) {
        group = 'application'
        description = descriptionText
        dependsOn demoClasses
        classpath = sourceSets.demo.runtimeClasspath
        mainClass = mainClassName
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
        workingDir = projectDir
        args launchArgs
    }
}

[
        runLearnOpenGlDemo: 'com.kaleblangley.haikalat.demo.LearnOpenGlDemo',
        runEmptyWindowDemo: 'com.kaleblangley.haikalat.demo.EmptyWindowDemo',
        runMinimalDemo    : 'com.kaleblangley.haikalat.demo.MinimalDemo',
        runAsyncDemo      : 'com.kaleblangley.haikalat.demo.async.AsyncDemo',
        runStressDemo     : 'com.kaleblangley.haikalat.demo.stress.StressDemo'
].each { taskName, mainClassName ->
    registerDemoApplication(taskName,
            "Runs ${mainClassName} for interactive graphics debugging.",
            mainClassName, [])
}

tasks.named('runStressDemo', JavaExec) {
    args "--shape=${providers.gradleProperty('stressShape').getOrElse('triangle')}",
            "--instances=${providers.gradleProperty('stressInstances').getOrElse('100000')}",
            "--mode=${providers.gradleProperty('stressMode').getOrElse('gpu')}"
    if (providers.gradleProperty('stressFrames').isPresent()) {
        args "--frames=${providers.gradleProperty('stressFrames').get()}"
    }
    if (providers.gradleProperty('stressWarmup').isPresent()) {
        args "--warmup=${providers.gradleProperty('stressWarmup').get()}"
    }
    if (providers.gradleProperty('stressHidden').getOrElse('false').toBoolean()) {
        args '--hidden'
    }
}

tasks.named('runEmptyWindowDemo', JavaExec) {
    if (providers.gradleProperty('emptyFrames').isPresent()) {
        args "--frames=${providers.gradleProperty('emptyFrames').get()}"
    }
    if (providers.gradleProperty('emptyHidden').getOrElse('false').toBoolean()) {
        args '--hidden'
    }
    if (providers.gradleProperty('emptyWarmup').isPresent()) {
        args "--warmup=${providers.gradleProperty('emptyWarmup').get()}"
    }
    if (providers.gradleProperty('emptyVsync').getOrElse('false').toBoolean()) {
        args '--vsync'
    }
}

def stressMainClass = 'com.kaleblangley.haikalat.demo.stress.StressDemo'
[
        runStressTriangleDemo          : ['triangle', 'gpu',
                'Runs the 100000-triangle expanded procedural baseline.'],
        runStressQuadDemo              : ['quad', 'gpu',
                'Runs the 100000-quad expanded procedural baseline.'],
        runStressCubeDemo              : ['cube', 'gpu',
                'Runs the 100000-cube expanded procedural baseline.'],
        runStressIndexedQuadDemo       : ['quad', 'indexed',
                'Runs 100000 indexed quads with a uint8 EBO.'],
        runStressIndexedCubeDemo       : ['cube', 'indexed',
                'Runs 100000 indexed procedural cubes with a uint8 EBO.'],
        runStressIndexedSsboTriangleDemo: ['triangle', 'indexed-ssbo',
                'Runs 100000 triangles with compact 16-byte SSBO instances.'],
        runStressIndexedSsboQuadDemo   : ['quad', 'indexed-ssbo',
                'Runs 100000 indexed quads with compact 16-byte SSBO instances.'],
        runStressIndexedSsboCubeDemo   : ['cube', 'indexed-ssbo',
                'Runs 100000 indexed cubes with compact 16-byte SSBO instances.'],
        runStressDynamicTriangleDemo   : ['triangle', 'dynamic',
                'Runs the 100000-triangle Matrix4f upload compatibility path.'],
        runStressDynamicCubeDemo       : ['cube', 'dynamic',
                'Runs the 100000-cube Matrix4f upload compatibility path.']
].each { taskName, preset ->
    registerDemoApplication(taskName, preset[2], stressMainClass,
            ["--shape=${preset[0]}", '--instances=100000', "--mode=${preset[1]}"])
}
