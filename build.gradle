plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

group = 'com.kaleblangley'
version = '0.17.2'

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

project.ext.lwjglVersion = "3.3.3"
project.ext.jomlVersion = "1.10.9"
project.ext.jnaVersion = "5.18.1"
project.ext.lwjglNatives = detectLwjglNatives()

def generatedProceduralJava = layout.buildDirectory.dir('generated/sources/proceduralShaders/java')
def generatedProceduralResources = layout.buildDirectory.dir('generated/resources/proceduralShaders')
def generatedBuildInfoResources = layout.buildDirectory.dir('generated/resources/buildInfo')

def lwjglModules = [
        "lwjgl",
        "lwjgl-freetype",
        "lwjgl-glfw",
        "lwjgl-harfbuzz",
        "lwjgl-opengl",
        "lwjgl-stb",
        "lwjgl-yoga"
]

static String detectLwjglNatives() {
    String os = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT)
    String arch = System.getProperty("os.arch").toLowerCase(java.util.Locale.ROOT)
    boolean arm64 = arch in ["aarch64", "arm64"]
    boolean x86 = arch in ["x86", "i386", "i486", "i586", "i686"]

    if (os.contains("win")) {
        return x86 ? "natives-windows-x86" : arm64 ? "natives-windows-arm64" : "natives-windows"
    }
    if (os.contains("mac") || os.contains("darwin")) {
        return arm64 ? "natives-macos-arm64" : "natives-macos"
    }
    if (os.contains("linux")) {
        return arm64 ? "natives-linux-arm64" : "natives-linux"
    }
    throw new GradleException("Unsupported OS for LWJGL natives: $os")
}

sourceSets {
    main {
        resources.srcDir generatedBuildInfoResources
    }
    shaderGenerator {
        java.srcDir 'src/shaderGenerator/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    demo {
        java.srcDir generatedProceduralJava
        resources.srcDir generatedProceduralResources
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

tasks.register('generateBuildInfo') {
    def revision = providers.environmentVariable('GITHUB_SHA').getOrElse('local')
    inputs.property('engineVersion', project.version.toString())
    inputs.property('buildRevision', revision)
    outputs.dir generatedBuildInfoResources
    doLast {
        File output = generatedBuildInfoResources.get().file('haikalat-build.properties').asFile
        output.parentFile.mkdirs()
        output.setText("engineVersion=${project.version}\nbuildRevision=${revision}\n", 'UTF-8')
    }
}

tasks.named('processResources') {
    dependsOn 'generateBuildInfo'
}

configurations {
    shaderGeneratorImplementation.extendsFrom implementation
    shaderGeneratorRuntimeOnly.extendsFrom runtimeOnly
    demoImplementation.extendsFrom implementation
    demoRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    lwjglModules.each { module ->
        implementation "org.lwjgl:$module"
        runtimeOnly "org.lwjgl:$module::$lwjglNatives"
    }

    implementation "org.joml:joml:${jomlVersion}"
    implementation "com.fasterxml.jackson.core:jackson-core:2.18.3"
    implementation "net.java.dev.jna:jna:${jnaVersion}"
    implementation "net.java.dev.jna:jna-platform:${jnaVersion}"

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation sourceSets.demo.output
}

test {
    useJUnitPlatform()
    systemProperty 'haikalat.glSmoke', System.getProperty('haikalat.glSmoke', 'false')
}

tasks.register('quickVerification') {
    group = 'verification'
    description = 'Runs the complete no-desktop verification gate.'
    dependsOn 'compileJava', 'demoClasses', 'test'
}

def configureGuardTest = { Test guard, List<String> patterns ->
    guard.group = 'verification'
    guard.dependsOn testClasses
    guard.testClassesDirs = sourceSets.test.output.classesDirs
    guard.classpath = sourceSets.test.runtimeClasspath
    guard.useJUnitPlatform()
    guard.filter {
        patterns.each { includeTestsMatching it }
    }
}

tasks.register('publicApiGuard', Test) {
    description = 'Validates the complete public API catalog, stable signatures and migration records.'
    configureGuardTest(delegate, [
            '*.ArchitectureBoundaryTest.wholeProjectPublicTypesMatchAllowlist',
            '*.ArchitectureBoundaryTest.stableSignaturesDoNotExposeImplementationLibraries',
            '*.ArchitectureBoundaryTest.removedStableTypesRequireMigrationRecord',
            '*.PbrPublicApiSurfaceTest', '*.UiPublicApiSurfaceTest',
            '*.GltfArchitectureTest.publicTypesMatchAllowlist'
    ])
}

tasks.register('architectureGuard', Test) {
    description = 'Validates package dependencies, OpenGL call sites and production escape hatches.'
    configureGuardTest(delegate, [
            '*.ArchitectureBoundaryTest.internalTypesStayInsideTheirSubsystemOrDemoProof',
            '*.ArchitectureBoundaryTest.backendDoesNotDependOnHigherLayers',
            '*.ArchitectureBoundaryTest.coreAndRuntimeDoNotDependOnSubsystems',
            '*.ArchitectureBoundaryTest.coreDoesNotDependOnRuntime',
            '*.ArchitectureBoundaryTest.uiRemainsASiblingSubsystemWithoutReverseDependencies',
            '*.ArchitectureBoundaryTest.nativeUiLibrariesStayInsideTheirAdapters',
            '*.ArchitectureBoundaryTest.uiLogicPackagesDoNotIssueOpenGlCalls',
            '*.ArchitectureBoundaryTest.productionCodeDoesNotUseCustomCommandEscapeHatch',
            '*.ArchitectureBoundaryTest.unverifiedNativeModelEntryPointAndDependencyStayRemoved',
            '*.GltfArchitectureTest.cpuLoaderDoesNotDependOnSubsystemOrInvokeOpenGl',
            '*.GltfArchitectureTest.backendDoesNotDependOnGltfPackages'
    ])
}

tasks.register('dependencyLockGuard') {
    group = 'verification'
    description = 'Verifies the committed dependency lock and the removed Assimp dependency contract.'
    inputs.files 'build.gradle', 'gradle.lockfile'
    doLast {
        File lock = file('gradle.lockfile')
        if (!lock.isFile()) throw new GradleException('Missing gradle.lockfile; run dependencies --write-locks')
        String buildText = file('build.gradle').getText('UTF-8')
        String lockText = lock.getText('UTF-8')
        String removedNativeModule = 'lwjgl-' + 'assimp'
        if (buildText.toLowerCase(Locale.ROOT).contains(removedNativeModule)
                || lockText.toLowerCase(Locale.ROOT).contains(removedNativeModule)) {
            throw new GradleException('Assimp must not re-enter the v0.14 dependency graph')
        }
        ['org.lwjgl:lwjgl-opengl:3.3.3', 'org.joml:joml:1.10.9',
         'com.fasterxml.jackson.core:jackson-core:2.18.3'].each { coordinate ->
            if (!lockText.contains(coordinate)) {
                throw new GradleException("Dependency lock is missing $coordinate")
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'quickVerification', 'publicApiGuard', 'architectureGuard',
            'dependencyLockGuard', 'assetManifestGuard'
}

