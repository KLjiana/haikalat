plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

group = 'com.kaleblangley'
version = '0.28.1'

def projectLicenseFile = layout.projectDirectory.file('LICENSE')
def projectLicenseManifest = [
        'License'       : 'AGPL-3.0-only',
        'Bundle-License': 'https://www.gnu.org/licenses/agpl-3.0.html'
]

tasks.named('sourcesJar', Jar) {
    dependsOn 'generateBuildInfo'
    inputs.file projectLicenseFile
    from(projectLicenseFile) {
        into 'META-INF'
        rename { 'LICENSE' }
    }
    manifest.attributes(projectLicenseManifest)
}

tasks.named('jar', Jar) {
    dependsOn tasks.named('sourcesJar')
    inputs.file projectLicenseFile
    from(projectLicenseFile) {
        into 'META-INF'
        rename { 'LICENSE' }
    }
    manifest.attributes(projectLicenseManifest)
}

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

project.ext.lwjglVersion = "3.3.3"
project.ext.jomlVersion = "1.10.9"
project.ext.jnaVersion = "5.18.1"
project.ext.jacksonVersion = "2.18.3"
project.ext.commonmarkVersion = "0.24.0"
project.ext.junitVersion = "5.10.0"
project.ext.lwjglNatives = detectLwjglNatives()

def generatedProceduralJava = layout.buildDirectory.dir('generated/sources/proceduralShaders/java')
def generatedProceduralResources = layout.buildDirectory.dir('generated/resources/proceduralShaders')
def generatedBuildInfoResources = layout.buildDirectory.dir('generated/resources/buildInfo')

def lwjglModules = [
        "lwjgl",
        "lwjgl-freetype",
        "lwjgl-glfw",
        "lwjgl-harfbuzz",
        "lwjgl-opengl",
        "lwjgl-stb",
        "lwjgl-yoga"
]

static String detectLwjglNatives() {
    String os = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT)
    String arch = System.getProperty("os.arch").toLowerCase(java.util.Locale.ROOT)
    boolean arm64 = arch in ["aarch64", "arm64"]
    boolean x86 = arch in ["x86", "i386", "i486", "i586", "i686"]

    if (os.contains("win")) {
        return x86 ? "natives-windows-x86" : arm64 ? "natives-windows-arm64" : "natives-windows"
    }
    if (os.contains("mac") || os.contains("darwin")) {
        return arm64 ? "natives-macos-arm64" : "natives-macos"
    }
    if (os.contains("linux")) {
        return arm64 ? "natives-linux-arm64" : "natives-linux"
    }
    throw new GradleException("Unsupported OS for LWJGL natives: $os")
}

sourceSets {
    main {
        resources.srcDir generatedBuildInfoResources
    }
    shaderGenerator {
        java.srcDir 'src/shaderGenerator/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    demo {
        java.srcDir generatedProceduralJava
        resources.srcDir generatedProceduralResources
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

tasks.register('generateBuildInfo') {
    def revision = providers.environmentVariable('GITHUB_SHA').getOrElse('local')
    inputs.property('engineVersion', project.version.toString())
    inputs.property('buildRevision', revision)
    outputs.dir generatedBuildInfoResources
    doLast {
        File output = generatedBuildInfoResources.get().file('haikalat-build.properties').asFile
        output.parentFile.mkdirs()
        output.setText("engineVersion=${project.version}\nbuildRevision=${revision}\n", 'UTF-8')
    }
}

tasks.named('processResources') {
    dependsOn 'generateBuildInfo'
}

configurations {
    shaderGeneratorImplementation.extendsFrom implementation
    shaderGeneratorRuntimeOnly.extendsFrom runtimeOnly
    demoImplementation.extendsFrom implementation
    demoRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    lwjglModules.each { module ->
        implementation "org.lwjgl:$module"
        runtimeOnly "org.lwjgl:$module::$lwjglNatives"
    }

    implementation "org.joml:joml:${jomlVersion}"
    implementation "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
    implementation "net.java.dev.jna:jna:${jnaVersion}"
    implementation "net.java.dev.jna:jna-platform:${jnaVersion}"

    implementation "org.commonmark:commonmark:${commonmarkVersion}"

    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation sourceSets.demo.output
}

test {
    useJUnitPlatform()
    systemProperty 'haikalat.glSmoke', System.getProperty('haikalat.glSmoke', 'false')
    systemProperty 'haikalat.glReadback', System.getProperty('haikalat.glReadback', 'false')
}

tasks.register('quickVerification') {
    group = 'verification'
    description = 'Runs the complete no-desktop verification gate.'
    dependsOn 'compileJava', 'demoClasses', 'test'
}

tasks.named('check') {
    // `test` already executes every JUnit case. The filtered guard tasks remain
    // individually runnable, but must not re-execute their subsets here.
    dependsOn 'quickVerification', 'dependencyLockGuard', 'assetManifestGuard', 'vfxAssetGuard',
            'releaseVerificationContracts', 'animationJvmVerification'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

tasks.register('generateProceduralShaders', JavaExec) {
    group = 'build'
    description = 'Generates shape-specialized procedural stress shaders and their Java catalog.'
    dependsOn shaderGeneratorClasses
    classpath = sourceSets.shaderGenerator.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.tools.ProceduralShaderGenerator'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    args generatedProceduralJava.get().asFile.absolutePath,
            generatedProceduralResources.get().asFile.absolutePath
    inputs.files(fileTree('src/shaderGenerator'),
            file('src/main/java/com/kaleblangley/haikalat/core/mesh/BuiltinMeshData.java'))
    outputs.dirs(generatedProceduralJava, generatedProceduralResources)
}

tasks.named('compileDemoJava') {
    dependsOn 'generateProceduralShaders'
}
tasks.named('processDemoResources') {
    dependsOn 'generateProceduralShaders'
}

apply from: 'gradle/verification-tasks.gradle'
apply from: 'gradle/test-evidence.gradle'
apply from: 'gradle/demo-tasks.gradle'
apply from: 'gradle/ui-tasks.gradle'
apply from: 'gradle/diagnostics-tasks.gradle'
apply from: 'gradle/scene-tasks.gradle'
apply from: 'gradle/local-release-tasks.gradle'
apply from: 'gradle/release-verification.gradle'

apply from: 'gradle/focused-verification.gradle'
