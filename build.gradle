plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

group = 'com.kaleblangley'
version = '0.11.0'

repositories {
    mavenCentral()
}

project.ext.lwjglVersion = "3.3.3"
project.ext.jomlVersion = "1.10.9"
project.ext.jnaVersion = "5.18.1"
project.ext.lwjglNatives = detectLwjglNatives()

def generatedProceduralJava = layout.buildDirectory.dir('generated/sources/proceduralShaders/java')
def generatedProceduralResources = layout.buildDirectory.dir('generated/resources/proceduralShaders')

def lwjglModules = [
        "lwjgl",
        "lwjgl-assimp",
        "lwjgl-freetype",
        "lwjgl-glfw",
        "lwjgl-harfbuzz",
        "lwjgl-opengl",
        "lwjgl-stb",
        "lwjgl-yoga"
]

static String detectLwjglNatives() {
    String os = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT)
    String arch = System.getProperty("os.arch").toLowerCase(java.util.Locale.ROOT)
    boolean arm64 = arch in ["aarch64", "arm64"]
    boolean x86 = arch in ["x86", "i386", "i486", "i586", "i686"]

    if (os.contains("win")) {
        return x86 ? "natives-windows-x86" : arm64 ? "natives-windows-arm64" : "natives-windows"
    }
    if (os.contains("mac") || os.contains("darwin")) {
        return arm64 ? "natives-macos-arm64" : "natives-macos"
    }
    if (os.contains("linux")) {
        return arm64 ? "natives-linux-arm64" : "natives-linux"
    }
    throw new GradleException("Unsupported OS for LWJGL natives: $os")
}

sourceSets {
    shaderGenerator {
        java.srcDir 'src/shaderGenerator/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    demo {
        java.srcDir generatedProceduralJava
        resources.srcDir generatedProceduralResources
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    shaderGeneratorImplementation.extendsFrom implementation
    shaderGeneratorRuntimeOnly.extendsFrom runtimeOnly
    demoImplementation.extendsFrom implementation
    demoRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    lwjglModules.each { module ->
        implementation "org.lwjgl:$module"
        runtimeOnly "org.lwjgl:$module::$lwjglNatives"
    }

    implementation "org.joml:joml:${jomlVersion}"
    implementation "net.java.dev.jna:jna:${jnaVersion}"
    implementation "net.java.dev.jna:jna-platform:${jnaVersion}"

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation sourceSets.demo.output
}

test {
    useJUnitPlatform()
    systemProperty 'haikalat.glSmoke', System.getProperty('haikalat.glSmoke', 'false')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

tasks.register('generateProceduralShaders', JavaExec) {
    group = 'build'
    description = 'Generates shape-specialized procedural stress shaders and their Java catalog.'
    dependsOn shaderGeneratorClasses
    classpath = sourceSets.shaderGenerator.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.tools.ProceduralShaderGenerator'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    args generatedProceduralJava.get().asFile.absolutePath,
            generatedProceduralResources.get().asFile.absolutePath
    inputs.files(fileTree('src/shaderGenerator'),
            file('src/main/java/com/kaleblangley/haikalat/core/mesh/BuiltinMeshData.java'))
    outputs.dirs(generatedProceduralJava, generatedProceduralResources)
}

tasks.named('compileDemoJava') {
    dependsOn 'generateProceduralShaders'
}
tasks.named('processDemoResources') {
    dependsOn 'generateProceduralShaders'
}

apply from: 'demo-tasks.gradle'

def uiDemoMainClass = 'com.kaleblangley.haikalat.demo.ui.UiDemo'

tasks.register('runUiDemo', JavaExec) {
    group = 'application'
    description = 'Runs the retained-mode v0.11 UI control and layout showcase.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = uiDemoMainClass
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    workingDir = projectDir
    if (providers.gradleProperty('uiFrames').isPresent()) {
        args "--frames=${providers.gradleProperty('uiFrames').get()}"
    }
    if (providers.gradleProperty('uiResize').isPresent()) {
        args "--resize=${providers.gradleProperty('uiResize').get()}"
    }
    if (providers.gradleProperty('uiContentScale').isPresent()) {
        args "--content-scale=${providers.gradleProperty('uiContentScale').get()}"
    }
    if (providers.gradleProperty('uiHidden').getOrElse('false').toBoolean()) {
        args '--hidden', '--no-vsync'
    }
}

tasks.register('runUiIntegration', JavaExec) {
    group = 'verification'
    description = 'Runs UiDemo hidden with scripted controls, resize, content scale and pixel proof.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = uiDemoMainClass
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    workingDir = projectDir
    args '--deterministic', '--frames=12', '--resize=4:720x480',
            '--content-scale=1.25x1.5', '--verify-pixels'
    mustRunAfter 'glSmoke', 'runStressCubeIntegration'
}

tasks.register('runUiResizeIntegration', JavaExec) {
    group = 'verification'
    description = 'Runs deterministic UI resize, non-integer content scale and nested clipping checks.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = uiDemoMainClass
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    workingDir = projectDir
    args '--deterministic', '--frames=16', '--resize=2:640x400',
            '--resize=7:1024x640', '--resize=12:800x520',
            '--content-scale=1.375x1.625', '--verify-pixels'
    mustRunAfter 'runUiIntegration'
}

tasks.register('runUiAsyncIntegration', JavaExec) {
    group = 'verification'
    description = 'Runs three-slot async UI snapshot exchange and owner-thread cleanup checks.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.demo.ui.UiAsyncIntegration'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    workingDir = projectDir
    mustRunAfter 'runUiResizeIntegration'
}

tasks.register('runUiTextIntegration', JavaExec) {
    group = 'verification'
    description = 'Runs bundled Noto Sans SC FreeType/HarfBuzz shaping, atlas upload and pixel proof.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = uiDemoMainClass
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    workingDir = projectDir
    args '--deterministic', '--frames=10', '--content-scale=1.5x1.5', '--verify-pixels'
    mustRunAfter 'runUiAsyncIntegration'
}

tasks.register('runUiBenchmarks', JavaExec) {
    group = 'application'
    description = 'Runs five 1080p/4K rounds for the fixed v0.11 UI capacity scenes.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.kaleblangley.haikalat.demo.ui.UiBenchmarkSuite'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    workingDir = projectDir
    if (providers.gradleProperty('uiBenchmarkRounds').isPresent()) {
        args "--rounds=${providers.gradleProperty('uiBenchmarkRounds').get()}"
    }
    if (providers.gradleProperty('uiBenchmarkWarmup').isPresent()) {
        args "--warmup=${providers.gradleProperty('uiBenchmarkWarmup').get()}"
    }
    if (providers.gradleProperty('uiBenchmarkFrames').isPresent()) {
        args "--frames=${providers.gradleProperty('uiBenchmarkFrames').get()}"
    }
}

tasks.register('runUiInteractiveSoak', JavaExec) {
    group = 'verification'
    description = 'Runs a visible, time-bounded UiDemo for the manual Windows IME matrix.'
    dependsOn demoClasses
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = uiDemoMainClass
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    workingDir = projectDir
    args "--seconds=${providers.gradleProperty('uiSoakSeconds').getOrElse('60')}",
            '--script=none', '--vsync'
}

tasks.register('runUiSyntheticImeSoak', Test) {
    group = 'verification'
    description = 'Runs repeated synthetic IME, focus, resize, deletion and popup lifecycles.'
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.kaleblangley.haikalat.subsystems.ui.UiImeSyntheticSoakTest'
    }
    systemProperty 'haikalat.uiImeSoak', 'true'
    systemProperty 'haikalat.uiImeSoakCycles',
            providers.gradleProperty('uiImeSoakCycles').getOrElse('100')
    outputs.upToDateWhen { false }
}

tasks.register('runUiNativeSoak', Test) {
    group = 'verification'
    description = 'Runs at least 50 real Windows GLFW/WndProc hook lifecycles with GC pressure.'
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.kaleblangley.haikalat.subsystems.windowing.input.win32.Win32TextInputAdapterNativeSoakTest'
    }
    systemProperty 'haikalat.uiNativeSoak', 'true'
    systemProperty 'haikalat.uiNativeSoakRounds',
            providers.gradleProperty('uiNativeSoakRounds').getOrElse('50')
    outputs.upToDateWhen { false }
    mustRunAfter 'runUiSyntheticImeSoak'
}

tasks.register('localUiVerification') {
    group = 'verification'
    description = 'Runs real-GL UI smoke, deterministic, resize, async and text integrations.'
    dependsOn 'glSmoke', 'runUiIntegration', 'runUiResizeIntegration',
            'runUiAsyncIntegration', 'runUiTextIntegration',
            'runUiSyntheticImeSoak', 'runUiNativeSoak'
}

tasks.named('localGlVerification') {
    dependsOn 'localUiVerification'
}
